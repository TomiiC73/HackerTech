<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Crear cuenta — HackerBank</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        fontFamily: { sans: ['Inter', 'ui-sans-serif', 'system-ui', 'sans-serif'] },
        colors: { gold: { DEFAULT: '#c9a84c', light: '#e8d38a', dark: '#8f6f27' } },
      },
    },
  };
</script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
<style>
  html, body { background: #050507; color: #f5f5f7; font-family: 'Inter', ui-sans-serif, system-ui, sans-serif; }

  .glow { position: absolute; border-radius: 9999px; filter: blur(110px); pointer-events: none; }

  .grid-fade {
    background-image:
      linear-gradient(rgba(255,255,255,0.035) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.035) 1px, transparent 1px);
    background-size: 64px 64px;
    -webkit-mask-image: radial-gradient(ellipse 70% 65% at 50% 30%, #000 40%, transparent 100%);
    mask-image: radial-gradient(ellipse 70% 65% at 50% 30%, #000 40%, transparent 100%);
  }

  .glass {
    background: rgba(255, 255, 255, 0.04);
    border: 1px solid rgba(255, 255, 255, 0.08);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
  }

  .field input {
    width: 100%;
    background: rgba(255, 255, 255, 0.04);
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 0.9rem;
    padding: 0.85rem 1rem;
    color: #f5f5f7;
    font-size: 0.95rem;
    outline: none;
    transition: border-color .2s ease, background .2s ease;
  }
  .field input:focus { border-color: #c9a84c; background: rgba(255, 255, 255, 0.06); }
  .field label { display: block; font-size: 0.8rem; color: rgba(245,245,247,0.5); margin-bottom: 0.5rem; }

  .form-error {
    display: none;
    background: rgba(200, 38, 42, 0.1);
    border: 1px solid rgba(200, 38, 42, 0.35);
    color: #ff9a9c;
    font-size: 0.85rem;
    border-radius: 0.75rem;
    padding: 0.7rem 1rem;
    margin-bottom: 1.25rem;
  }
  .form-error.visible { display: block; }

  .text-gradient-gold {
    background: linear-gradient(95deg, #f3e3b4 0%, #c9a84c 45%, #8f6f27 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  /* --- Stepper --- */
  .stepper__dot {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    font-size: 0;
    font-weight: 600;
    color: rgba(245,245,247,0.35);
  }
  .stepper__dot::before {
    content: attr(data-step);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 1.6rem;
    height: 1.6rem;
    border-radius: 9999px;
    border: 1.5px solid rgba(255,255,255,0.15);
    font-size: 0.75rem;
  }
  .stepper__dot i {
    font-size: 0.75rem;
    font-style: normal;
  }
  .stepper__dot.active { color: #f5f5f7; }
  .stepper__dot.active::before {
    border-color: #c9a84c;
    background: #c9a84c;
    color: #050507;
  }
  @media (max-width: 420px) { .stepper__dot i { display: none; } }

  /* --- Camara: marco tipo visor --- */
  .camera-frame {
    position: relative;
    width: 280px;
    height: 280px;
    max-width: 80vw;
    max-height: 80vw;
    margin: 0.5rem auto 1.25rem;
    border-radius: 1.5rem;
    overflow: hidden;
    background: #000;
  }
  .camera-frame video, .camera-frame canvas {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  .camera-frame video { transform: scaleX(-1); }
  .camera-frame__overlay { position: absolute; inset: 18px; pointer-events: none; }
  .camera-frame__overlay::before,
  .camera-frame__overlay::after,
  .camera-frame__overlay > .tl, .camera-frame__overlay > .tr,
  .camera-frame__overlay > .bl, .camera-frame__overlay > .br { position: absolute; width: 22px; height: 22px; border-color: #c9a84c; border-style: solid; border-width: 0; }
  .camera-frame__overlay > .tl { top: 0; left: 0; border-top-width: 3px; border-left-width: 3px; border-top-left-radius: 8px; }
  .camera-frame__overlay > .tr { top: 0; right: 0; border-top-width: 3px; border-right-width: 3px; border-top-right-radius: 8px; }
  .camera-frame__overlay > .bl { bottom: 0; left: 0; border-bottom-width: 3px; border-left-width: 3px; border-bottom-left-radius: 8px; }
  .camera-frame__overlay > .br { bottom: 0; right: 0; border-bottom-width: 3px; border-right-width: 3px; border-bottom-right-radius: 8px; }

  .status-line {
    font-size: 0.8rem;
    letter-spacing: 0.02em;
    color: rgba(245,245,247,0.45);
    margin-bottom: 1.1rem;
    min-height: 1.1rem;
    text-align: center;
  }
  .status-line.error { color: #ff9a9c; }
  .status-line.success { color: #6ee7a8; }

</style>
</head>
<body class="antialiased min-h-screen">

<a href="{{ url_for('landing') }}" class="fixed top-6 left-6 lg:top-8 lg:left-10 z-20 flex items-center gap-2.5 text-base font-bold tracking-[0.2em] uppercase">
  <svg width="26" height="26" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
    <path d="M16 2L29 9V23L16 30L3 23V9L16 2Z" stroke="#c9a84c" stroke-width="1.4"/>
    <path d="M16 9L22 12.5V19.5L16 23L10 19.5V12.5L16 9Z" stroke="#f5f5f7" stroke-opacity="0.7" stroke-width="1.2"/>
  </svg>
  <span>Hacker<span class="text-gradient-gold">Bank</span></span>
</a>

<div class="relative min-h-screen flex items-center justify-center px-6 py-28 lg:py-16 overflow-hidden">
  <div class="absolute inset-0 grid-fade"></div>
  <div class="glow w-[520px] h-[520px] bg-gold/15 -top-40 -right-20"></div>
  <div class="glow w-[420px] h-[420px] bg-gold/10 bottom-0 left-0"></div>

  <div id="signup-card" class="relative glass rounded-3xl p-8 sm:p-10 w-full max-w-lg mx-auto">
    <div class="text-2xl font-bold mb-2">Crear tu cuenta</div>
    <div class="text-white/45 text-sm mb-7">Abrí tu cuenta y registrá tu rostro para autenticarte a futuro.</div>

    <div class="stepper flex justify-center gap-8 mb-8" id="stepper">
      <span class="stepper__dot active" data-step="1">1<i class="ml-1">Datos</i></span>
      <span class="stepper__dot" data-step="2">2<i class="ml-1">Rostro</i></span>
    </div>

    <div class="form-error" id="signup-error"></div>

    <!-- Paso 1: datos de la cuenta -->
    <form id="signup-form" class="space-y-4">
      <div class="field">
        <label for="full_name">Nombre y apellido</label>
        <input type="text" id="full_name" name="full_name" autocomplete="name" required>
      </div>
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" autocomplete="email" required>
      </div>
      <div class="field">
        <label for="dni">DNI</label>
        <input type="text" id="dni" name="dni" inputmode="numeric" required>
      </div>
      <div class="field">
        <label for="password">Contraseña</label>
        <input type="password" id="password" name="password" autocomplete="new-password" required>
      </div>
      <button type="submit" id="signup-continue"
        class="w-full py-3.5 rounded-full bg-gold text-black font-semibold hover:bg-gold-light transition-colors">
        Continuar
      </button>
    </form>

    <!-- Paso 2: escaneo de rostro -->
    <div id="signup-face" style="display:none;">
      <p class="text-white/50 text-sm leading-relaxed mb-5 text-center">
        Encuadrá tu rostro dentro del marco. Vamos a tomar varias fotos
        automáticamente para registrar tu cara.
      </p>

      <div class="camera-frame">
        <video id="signup-video" autoplay playsinline muted></video>
        <canvas id="signup-canvas" style="display:none;"></canvas>
        <div class="camera-frame__overlay">
          <span class="tl"></span><span class="tr"></span><span class="bl"></span><span class="br"></span>
        </div>
      </div>

      <div class="status-line" id="signup-status">Iniciando cámara...</div>
      <button type="button" id="signup-capture" disabled
        class="w-full py-3.5 rounded-full bg-gold text-black font-semibold hover:bg-gold-light transition-colors disabled:opacity-50">
        Registrar mi rostro
      </button>
    </div>

    <div class="text-center text-sm text-white/45 mt-7">
      ¿Ya tenés cuenta? <a href="{{ url_for('login_page') }}" class="text-gold font-medium hover:text-gold-light">Ingresá</a>
    </div>
  </div>
</div>

<script>
  gsap.from('#signup-card', { opacity: 0, y: 30, duration: 0.9, ease: 'power3.out' });
</script>
<script src="{{ url_for('static', filename='js/signup.js') }}"></script>
</body>
</html>
